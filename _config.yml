title: MaiML Documents
description: Markdown editions of the MaiML operational guideline and the MaiML manifesto.
url: "https://maiml-org.github.io"
baseurl: "/MaiML-Documents"

markdown: kramdown
kramdown:
  input: GFM

# Every Markdown document in ja/ and en/ carries YAML front matter and is
# rendered with the same layout.  The Markdown files themselves are generated
# artifacts and must not be edited here; see README.md.
defaults:
  - scope:
      path: ""
    values:
      layout: document

# Licensing differs per document, so it is attached here rather than in the
# generated Markdown, which must stay byte-identical to the build output.
  - scope:
      path: "ja/guideline.md"
    values:
      copyright: "MaiML Core Team"
      licence: "CC BY 4.0"
      licence_url: "https://creativecommons.org/licenses/by/4.0/"
  - scope:
      path: "en/guideline.md"
    values:
      copyright: "MaiML Core Team"
      licence: "CC BY 4.0"
      licence_url: "https://creativecommons.org/licenses/by/4.0/"
  - scope:
      path: "ja/manifesto.md"
    values:
      copyright: "Takuo Yasunaga"
      licence_pending: true
  - scope:
      path: "en/manifesto.md"
    values:
      copyright: "Takuo Yasunaga"
      licence_pending: true
